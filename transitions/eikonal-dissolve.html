<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>RedKey Eikonal front-dissolve — content-aware prototype</title>
<style>
  html,body{margin:0;background:#111;display:grid;place-items:center;min-height:100vh}
  canvas{width:min(96vw,96vh);height:min(96vw,96vh);background:#000}
  #hud{position:fixed;top:8px;left:8px;font:11px/1.5 monospace;color:#b8aa98;white-space:pre;background:#0009;padding:6px 8px;border-radius:6px;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" width="900" height="900"></canvas>
<div id="hud"></div>
<script>
// EIKONAL / FAST MARCHING content-aware dissolve.
// Solves |grad T| = 1/F(x): a front whose SPEED F is fast on the background mass and
// slow on the picture's content/edges, so it floods the background and tendrils into
// the subject (the subject reveals last). Distinct from the Dijkstra geodesic by using
// the proper upwind quadratic update (Euclidean-accurate fronts, no grid metrication).
const Q=new URLSearchParams(location.search);
const A_SRC=Q.get('a')||'s1-last.png', B_SRC=Q.get('b')||'s2-first.png';
const DUR=+(Q.get('dur')||2.8);
const G=+(Q.get('g')||140);             // sim grid resolution
const CONTRAST=+(Q.get('contrast')||1.0);// how strongly content slows the front (relationship to piece)
const ORG=+(Q.get('org')||1.0);         // fractal tendril strength baked into the speed field
const FAST=+(Q.get('fast')||1.0);       // background front speed
const SLOW=+(Q.get('slow')||0.12);      // content/edge front speed (low => holds longest)
const BAND=+(Q.get('band')||0.14);      // glyph burn-front width (progress units)
const FEATHER=+(Q.get('feather')||0.05);
const GLYPHFRONT=Q.get('glyphfront')!=='0';
const STATIC=Q.has('p')?+Q.get('p'):null;
const SIZE=900, SCL=SIZE/G, RED='#dc2626', TAN='#b8aa98', WHITE='#fafafa';
const GLYPHS=('ABCDEFGHJKLMNPQRSTUVWXYZ0123456789@#%&$*+=/<>?¥£§アイウエオカキクabcdefghkmnpqrstuvwxyz∆∇∂∫≈≠≡⌘⎔░▒▓█╳╱╲┃━╋ΩΨΦΣΞΛ').split('');
const c=document.getElementById('c'), x=c.getContext('2d'), hud=document.getElementById('hud');
const N=G*G;

function loadImg(s){return new Promise((r,j)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=j;i.src=s;});}
function hash(a,b){let h=(a*374761393+b*668265263)^0x5bd1e995;h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967295;}
function fnoise(fx,fy){const f=(px,py)=>{const x0=Math.floor(px),y0=Math.floor(py),tx=px-x0,ty=py-y0,a=hash(x0,y0),b=hash(x0+1,y0),cc=hash(x0,y0+1),d=hash(x0+1,y0+1),sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);return (a*(1-sx)+b*sx)*(1-sy)+(cc*(1-sx)+d*sx)*sy;};return 0.55*f(fx,fy)+0.30*f(fx*2.2+5,fy*2.2+9)+0.15*f(fx*4.7+3,fy*4.7+1);}
// binary min-heap with lazy deletion (decrease-key via re-push + stale skip)
function Heap(){this.a=[];}
Heap.prototype.push=function(p,v){const a=this.a;a.push([p,v]);let i=a.length-1;while(i>0){const par=(i-1)>>1;if(a[par][0]<=a[i][0])break;[a[par],a[i]]=[a[i],a[par]];i=par;}};
Heap.prototype.pop=function(){const a=this.a,top=a[0],last=a.pop();if(a.length){a[0]=last;let i=0;for(;;){let l=2*i+1,r=l+1,m=i;if(l<a.length&&a[l][0]<a[m][0])m=l;if(r<a.length&&a[r][0]<a[m][0])m=r;if(m===i)break;[a[m],a[i]]=[a[i],a[m]];i=m;}}return top;};
Heap.prototype.size=function(){return this.a.length;};

(async function(){
  const [A,B]=await Promise.all([loadImg(A_SRC),loadImg(B_SRC)]);
  const oA=document.createElement('canvas');oA.width=oA.height=SIZE;oA.getContext('2d').drawImage(A,0,0,SIZE,SIZE);
  const oB=document.createElement('canvas');oB.width=oB.height=SIZE;oB.getContext('2d').drawImage(B,0,0,SIZE,SIZE);
  // sample A on sim grid -> luminance + edge strength
  const sa=document.createElement('canvas');sa.width=sa.height=G;const sc=sa.getContext('2d');sc.drawImage(A,0,0,G,G);
  const ad=sc.getImageData(0,0,G,G).data, lum=new Float32Array(N);
  let hist=new Array(16).fill(0);
  for(let i=0;i<N;i++){const L=(0.2126*ad[i*4]+0.7152*ad[i*4+1]+0.0722*ad[i*4+2])/255;lum[i]=L;hist[Math.min(15,(L*16)|0)]++;}
  const edge=new Float32Array(N);
  for(let y=1;y<G-1;y++)for(let xx=1;xx<G-1;xx++){const i=y*G+xx;edge[i]=Math.min(1,(Math.abs(lum[i]-lum[i-1])+Math.abs(lum[i]-lum[i+1])+Math.abs(lum[i]-lum[i-G])+Math.abs(lum[i]-lum[i+G]))*2);}
  let mode=0;for(let i=1;i<16;i++)if(hist[i]>hist[mode])mode=i;const modeL=(mode+0.5)/16;

  // content map: 0 on background mass, 1 on subject/edges; speed F = SLOW..FAST, fractal-warped
  const F=new Float32Array(N);
  for(let i=0;i<N;i++){const gx=i%G,gy=(i/G)|0;
    const content=Math.min(1, CONTRAST*(Math.max(edge[i], Math.abs(lum[i]-modeL)*1.8)));
    const branch=0.35+0.65*Math.pow(fnoise(gx*0.13,gy*0.13),1.6); // cheap tendril paths
    F[i]=(SLOW + (FAST-SLOW)*(1-content)) * (1 + ORG*(branch-0.5));
    if(F[i]<1e-3)F[i]=1e-3;
  }
  // seed = centroid of dominant-luminance region (a real point on the piece) or ?seedx,?seedy
  let sx=0,sy=0,cnt=0;for(let i=0;i<N;i++)if(Math.abs(lum[i]-modeL)<0.12){sx+=i%G;sy+=(i/G)|0;cnt++;}
  const SX=Q.has('seedx')?+Q.get('seedx'):Math.round(cnt?sx/cnt:G/2), SY=Q.has('seedy')?+Q.get('seedy'):Math.round(cnt?sy/cnt:G/2);

  // ---------- FAST MARCHING METHOD: upwind eikonal solve ----------
  const T=new Float32Array(N).fill(Infinity);
  const frozen=new Uint8Array(N);
  const hp=new Heap();
  function eik(i){const gx=i%G,gy=(i/G)|0;
    let Tx=Infinity; if(gx>0&&frozen[i-1])Tx=Math.min(Tx,T[i-1]); if(gx<G-1&&frozen[i+1])Tx=Math.min(Tx,T[i+1]);
    let Ty=Infinity; if(gy>0&&frozen[i-G])Ty=Math.min(Ty,T[i-G]); if(gy<G-1&&frozen[i+G])Ty=Math.min(Ty,T[i+G]);
    const cost=1/Math.max(1e-3,F[i]);            // slowness, grid spacing h=1
    if(Tx===Infinity&&Ty===Infinity)return Infinity;
    if(Tx===Infinity)return Ty+cost;
    if(Ty===Infinity)return Tx+cost;
    const diff=Tx-Ty;
    if(Math.abs(diff)<cost)return (Tx+Ty+Math.sqrt(2*cost*cost-diff*diff))/2; // quadratic update
    return Math.min(Tx,Ty)+cost;                  // degenerate -> 1D update
  }
  const seed=SY*G+SX; T[seed]=0; hp.push(0,seed);
  let maxT=1e-6;
  while(hp.size()){const [d,i]=hp.pop(); if(frozen[i])continue; frozen[i]=1; if(d>maxT&&d<Infinity)maxT=d;
    const gx=i%G,gy=(i/G)|0;
    const nb=[]; if(gx>0)nb.push(i-1); if(gx<G-1)nb.push(i+1); if(gy>0)nb.push(i-G); if(gy<G-1)nb.push(i+G);
    for(const j of nb){ if(frozen[j])continue; const nt=eik(j); if(nt<T[j]){T[j]=nt;hp.push(nt,j);} }
  }
  // normalise arrival -> 0..1 progress field
  const Tn=new Float32Array(N);
  for(let i=0;i<N;i++)Tn[i]=T[i]<Infinity?Math.min(1,T[i]/maxT):1;

  // glyph + colour per cell (stable)
  const gch=new Array(N),gcol=new Array(N);
  for(let i=0;i<N;i++){gch[i]=GLYPHS[(hash(i,11)*GLYPHS.length)|0];const L=lum[i];gcol[i]=L<0.33?RED:(L<0.7?TAN:WHITE);}

  // smooth mask upscale (small alpha grid -> bilinear) so reveal edges are not blocky
  const msmall=document.createElement('canvas');msmall.width=msmall.height=G;const mctx=msmall.getContext('2d');
  const idata=mctx.createImageData(G,G);
  const layer=document.createElement('canvas');layer.width=layer.height=SIZE;const lctx=layer.getContext('2d');
  x.textAlign='center';x.textBaseline='middle';
  console.log('[eikonal]',{grid:G,seed:SX+','+SY,modeL:modeL.toFixed(2),maxT:maxT.toFixed(2),fast:FAST,slow:SLOW});

  function frame(p){
    x.clearRect(0,0,SIZE,SIZE);x.drawImage(oB,0,0);                 // B underneath
    const d=idata.data;                                            // A-coverage alpha (smooth feather)
    for(let i=0;i<N;i++){let a=(Tn[i]-p)/FEATHER+0.5;a=a<0?0:a>1?1:a;d[i*4]=255;d[i*4+1]=255;d[i*4+2]=255;d[i*4+3]=(a*255)|0;}
    mctx.putImageData(idata,0,0);
    lctx.clearRect(0,0,SIZE,SIZE);lctx.imageSmoothingEnabled=true;
    lctx.globalCompositeOperation='source-over';lctx.drawImage(oA,0,0);
    lctx.globalCompositeOperation='destination-in';lctx.drawImage(msmall,0,0,SIZE,SIZE);
    x.drawImage(layer,0,0);                                        // A masked by coverage -> B shows through
    if(GLYPHFRONT){                                                // glyph burn-front along advancing tips
      for(let i=0;i<N;i++){const ph=(p-(Tn[i]-BAND))/BAND;if(ph<=0||ph>1.5)continue;
        const bell=Math.sin(Math.min(1,ph)*Math.PI);if(bell<0.06)continue;
        const gx=i%G,gy=(i/G)|0;const jx=(hash(i,3)-0.5)*SCL*0.6,jy=(hash(i,5)-0.5)*SCL*0.6;
        const sz=SCL*(0.7+1.3*Math.min(1,ph));x.globalAlpha=bell;x.fillStyle=gcol[i];x.font=`${sz|0}px monospace`;
        x.fillText(gch[i],gx*SCL+SCL/2+jx,gy*SCL+SCL/2+jy);}
      x.globalAlpha=1;
    }
    hud.textContent=`p ${p.toFixed(2)}  EIKONAL/FMM  grid ${G}  seed ${SX},${SY}\nfront fast ${FAST} slow ${SLOW}  contrast ${CONTRAST}  org ${ORG}  glyph-front ${GLYPHFRONT?'on':'off'}`;
  }
  if(STATIC!==null){frame(STATIC);return;}
  let st=null;function loop(ts){if(st===null)st=ts;const p=((ts-st)/1000/DUR)%1.2;frame(Math.min(1,p));requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
