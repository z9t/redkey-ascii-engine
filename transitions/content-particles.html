<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>RedKey content-particle transition — saliency-attracted glyph swarm</title>
<style>
  html,body{margin:0;background:#0a0808;display:grid;place-items:center;min-height:100vh}
  canvas{width:min(96vw,96vh);height:min(96vw,96vh);background:#0a0808}
  #hud{position:fixed;top:8px;left:8px;font:11px/1.5 monospace;color:#b8aa98;white-space:pre;background:#0009;padding:6px 8px;border-radius:6px;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" width="900" height="900"></canvas>
<div id="hud"></div>
<script>
// CONTENT-PARTICLE transition. Glyph particles are DRAWN TO the parts of frame A
// most distinct from its background (saliency, after Itti–Koch–Niebur 1998), so the
// swarm gathers INTO A's subject; over the transition the attraction migrates to the
// TARGET frame B's salient parts, so the same glyphs flow and reassemble as B's subject.
// Particle system after Reeves 1983; organic flow via curl-noise after Bridson 2007.
const Q=new URLSearchParams(location.search);
const A_SRC=Q.get('a')||'s1-last.png', B_SRC=Q.get('b')||'s2-first.png';
const DUR=+(Q.get('dur')||3.4);
const G=+(Q.get('g')||130);              // saliency grid
const NP=+(Q.get('particles')||7000);
const SPRING=+(Q.get('spring')||0.050);  // pull toward the salient home
const DRAG=+(Q.get('drag')||0.86);
const TURB=+(Q.get('turb')||1.1);        // curl-noise flow strength (peaks mid-transition)
const CSCALE=+(Q.get('cscale')||0.006);
const TRAILS=+(Q.get('trails')||0.30);   // motion-trail persistence (0..1 bg clear alpha)
const SALG=+(Q.get('salg')||1.8);        // saliency gamma: bias particles to the MOST distinct parts
const TRUECOL=Q.get('truecolor')==='1';
const STATIC=Q.has('p')?+Q.get('p'):null;
const SIZE=900, SCL=SIZE/G, RED='#dc2626', TAN='#b8aa98', WHITE='#fafafa';
const GLYPHS=('ABCDEFGHJKLMNPQRSTUVWXYZ0123456789@#%&$*+=/<>?¥£§アイウエオカキクабвгдabcdefghkmnpqrstuvwxyz∆∇∂∫≈≠≡⌘⎔░▒▓█╳╱╲┃━╋ΩΨΦΣΞΛ龍火水').split('');
const c=document.getElementById('c'), x=c.getContext('2d'), hud=document.getElementById('hud');
const N=G*G;

function loadImg(s){return new Promise((r,j)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=j;i.src=s;});}
function hash(a,b){let h=(a*374761393+b*668265263)^0x5bd1e995;h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967295;}
let RS=2463534242>>>0;function rnd(){RS^=RS<<13;RS^=RS>>>17;RS^=RS<<5;RS>>>=0;return RS/4294967296;}
function vnoise(fx,fy){const f=(px,py)=>{const x0=Math.floor(px),y0=Math.floor(py),tx=px-x0,ty=py-y0,a=hash(x0,y0),b=hash(x0+1,y0),cc=hash(x0,y0+1),d=hash(x0+1,y0+1),sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);return (a*(1-sx)+b*sx)*(1-sy)+(cc*(1-sx)+d*sx)*sy;};return f(fx,fy);}
function curl(px,py){const e=0.6;
  const n1=vnoise(px,py+e),n2=vnoise(px,py-e),n3=vnoise(px+e,py),n4=vnoise(px-e,py);
  return [(n1-n2)/(2*e),-(n3-n4)/(2*e)];}

function analyse(img){const s=document.createElement('canvas');s.width=s.height=G;const ct=s.getContext('2d');ct.drawImage(img,0,0,G,G);
  const d=ct.getImageData(0,0,G,G).data,lum=new Float32Array(N),col=new Uint8Array(N*3);let hist=new Array(16).fill(0);
  for(let i=0;i<N;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2];col[i*3]=r;col[i*3+1]=g;col[i*3+2]=b;
    const L=(0.2126*r+0.7152*g+0.0722*b)/255;lum[i]=L;hist[Math.min(15,(L*16)|0)]++;}
  let mode=0;for(let i=1;i<16;i++)if(hist[i]>hist[mode])mode=i;const bg=(mode+0.5)/16;
  const sal=new Float32Array(N);let mx=1e-6;
  for(let y=1;y<G-1;y++)for(let xx=1;xx<G-1;xx++){const i=y*G+xx;
    const edge=Math.abs(lum[i]-lum[i-1])+Math.abs(lum[i]-lum[i+1])+Math.abs(lum[i]-lum[i-G])+Math.abs(lum[i]-lum[i+G]);
    let v=Math.pow(Math.min(1,1.3*edge+1.7*Math.abs(lum[i]-bg)),SALG);sal[i]=v;if(v>mx)mx=v;}
  for(let i=0;i<N;i++)sal[i]/=mx;
  return {lum,col,sal,bg};}
function buildCDF(sal){const cdf=new Float32Array(N);let s=0;for(let i=0;i<N;i++){s+=sal[i]+1e-6;cdf[i]=s;}return{cdf,tot:s};}
function pick(c){let r=rnd()*c.tot,lo=0,hi=N-1;while(lo<hi){const m=(lo+hi)>>1;if(c.cdf[m]<r)lo=m+1;else hi=m;}return lo;}
function band(L){return L<0.33?RED:(L<0.7?TAN:WHITE);}

(async function(){
  const [A,B]=await Promise.all([loadImg(A_SRC),loadImg(B_SRC)]);
  const SA=analyse(A), SB=analyse(B);
  const cA=buildCDF(SA.sal), cB=buildCDF(SB.sal);
  // particle arrays
  const px=new Float32Array(NP),py=new Float32Array(NP),vx=new Float32Array(NP),vy=new Float32Array(NP);
  const ax=new Float32Array(NP),ay=new Float32Array(NP),bx=new Float32Array(NP),by=new Float32Array(NP);
  const ai=new Int32Array(NP),bi=new Int32Array(NP),gch=new Array(NP),gsz=new Float32Array(NP);
  for(let p=0;p<NP;p++){const a=pick(cA),b=pick(cB);ai[p]=a;bi[p]=b;
    ax[p]=((a%G)+rnd())*SCL;ay[p]=(((a/G)|0)+rnd())*SCL;
    bx[p]=((b%G)+rnd())*SCL;by[p]=(((b/G)|0)+rnd())*SCL;
    px[p]=ax[p];py[p]=ay[p];gch[p]=GLYPHS[(rnd()*GLYPHS.length)|0];
    gsz[p]=6+9*SA.sal[a];}
  x.textAlign='center';x.textBaseline='middle';
  let tflow=0;
  function smooth(p){return p*p*(3-2*p);}
  function step(p){const pe=smooth(p),transit=Math.sin(Math.min(1,p)*Math.PI);tflow+=0.012;
    for(let i=0;i<NP;i++){const hx=ax[i]+(bx[i]-ax[i])*pe,hy=ay[i]+(by[i]-ay[i])*pe;
      let fx=(hx-px[i])*SPRING,fy=(hy-py[i])*SPRING;
      const cu=curl(px[i]*CSCALE+tflow,py[i]*CSCALE-tflow);fx+=cu[0]*TURB*transit;fy+=cu[1]*TURB*transit;
      vx[i]=(vx[i]+fx)*DRAG;vy[i]=(vy[i]+fy)*DRAG;px[i]+=vx[i];py[i]+=vy[i];}}
  function draw(p){
    x.globalCompositeOperation='source-over';x.fillStyle=`rgba(10,8,8,${TRAILS})`;x.fillRect(0,0,SIZE,SIZE);
    x.globalCompositeOperation='lighter';
    const useB=p>=0.5;const S=useB?SB:SA;const idx=useB?bi:ai;
    for(let i=0;i<NP;i++){const ci=idx[i];let col;
      if(TRUECOL){col=`rgb(${S.col[ci*3]},${S.col[ci*3+1]},${S.col[ci*3+2]})`;}else{col=band(S.lum[ci]);}
      x.fillStyle=col;x.font=`${gsz[i]|0}px monospace`;x.fillText(gch[i],px[i],py[i]);}
    x.globalCompositeOperation='source-over';
    hud.textContent=`p ${p.toFixed(2)}  CONTENT-PARTICLES  ${NP} glyphs\nsaliency-attracted  spring ${SPRING}  turb ${TURB}  drawn: A-subject -> B-subject`;
  }
  console.log('[content-particles]',{particles:NP,grid:G,bgA:SA.bg.toFixed(2),bgB:SB.bg.toFixed(2)});
  if(STATIC!==null){const K=Math.round(STATIC*300)+40;for(let s=0;s<K;s++)step((s/K)*STATIC);draw(STATIC);return;}
  let st=null;function loop(ts){if(st===null)st=ts;const p=((ts-st)/1000/DUR)%1.25;const pc=Math.min(1,p);step(pc);draw(pc);requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
