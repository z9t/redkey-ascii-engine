<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLMIA // ASCII Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ── SVG NOISE FILTER (inline, no external deps) ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.4;
}

:root {
  --bg:       #06060a;
  --surface:  #0c0c12;
  --surf2:    #101018;
  --border:   #181825;
  --border2:  #252538;
  --border3:  #30304a;
  --text:     #bebed4;
  --dim:      #555570;
  --muted:    #2e2e42;
  --c-cyan:   #5ce1ff;
  --c-green:  #4dff91;
  --c-yellow: #ffd84d;
  --c-pink:   #ff4a9a;
  --c-orange: #ff8c42;
  --c-purple: #b87fff;
  --c-red:    #ff4d4d;
  --font-mono: 'IBM Plex Mono', 'Space Mono', 'Courier New', monospace;
  --font-disp: 'Space Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--dim); }

/* ── HEADER ── */
.header {
  position: relative;
  padding: 48px 40px 40px;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, var(--border2) 30%, var(--border2) 70%, transparent 100%);
}
.h-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.h-pre {
  font-family: var(--font-mono);
  font-size: clamp(5px, 0.78vw, 7.5px);
  line-height: 1.08;
  color: var(--c-cyan);
  text-shadow: 0 0 35px rgba(92,225,255,0.4), 0 0 70px rgba(92,225,255,0.15);
  letter-spacing: 0.04em;
  white-space: pre;
  text-align: left;
  display: inline-block;
}
.h-sub {
  font-family: var(--font-disp);
  font-size: 10px;
  letter-spacing: 0.4em;
  color: var(--dim);
  text-transform: uppercase;
}
.h-badges { display: flex; gap: 8px; }
.badge {
  font-size: 9px;
  letter-spacing: 0.18em;
  padding: 3px 10px;
  border: 1px solid var(--border3);
  color: var(--dim);
  text-transform: uppercase;
  background: var(--surface);
}
.badge.dev   { border-color: rgba(92,225,255,0.4); color: var(--c-cyan); background: rgba(92,225,255,0.04); }
.badge.live  { border-color: rgba(255,74,154,0.4); color: var(--c-pink); background: rgba(255,74,154,0.04); }
.badge.pend  { border-color: rgba(255,216,77,0.3); color: var(--c-yellow); background: rgba(255,216,77,0.04); }

/* ── NAV ── */
.nav-bar {
  display: flex;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 40px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-wrap: wrap;
}
.nav-btn {
  background: none;
  border: none;
  border-right: 1px solid var(--border);
  color: var(--dim);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 11px 20px;
  cursor: pointer;
  transition: color 0.12s, background 0.12s;
}
.nav-btn:hover  { color: var(--text); background: var(--surf2); }
.nav-btn.active { color: var(--c-cyan); background: var(--surf2); }

/* ── GRID ── */
.grid {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px 40px 60px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
  gap: 14px;
}
@media (max-width: 540px) {
  .grid { grid-template-columns: 1fr; padding: 12px 16px; gap: 10px; }
  .header { padding: 36px 20px 28px; }
  .nav-bar { padding: 0 16px; }
}

/* ── PANEL ── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border2);
  opacity: 0;
  transform: translateY(12px);
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
}
/* top accent line */
.panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 5%, var(--border2) 50%, transparent 95%);
}
/* inner texture — subtle grid lines */
.panel::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(255,255,255,0.012) 23px, rgba(255,255,255,0.012) 24px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.012) 39px, rgba(255,255,255,0.012) 40px);
  pointer-events: none;
  z-index: 0;
}

/* scanline on specific panels */
.panel.scanlines .panel-body { position: relative; }
.panel.scanlines .panel-body::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
  pointer-events: none;
  z-index: 10;
  animation: scanroll 8s linear infinite;
}
@keyframes scanroll { 0% { background-position: 0 0; } 100% { background-position: 0 80px; } }

.panel-label {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.25);
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--dim);
  text-transform: uppercase;
}
.dots { display: flex; gap: 5px; }
.dot  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dot-r { background: #ff5f57; }
.dot-y { background: #febc2e; }
.dot-g { background: #28c840; }

.panel-body {
  position: relative;
  z-index: 1;
  padding: 16px;
}

/* ── LOGO PANEL ── */
.logo-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  padding: 24px 12px 20px;
}
.logo-wrap pre {
  font-family: var(--font-mono);
  font-size: clamp(5px, 0.76vw, 7.5px);
  line-height: 1.08;
  color: var(--c-cyan);
  text-shadow: 0 0 30px rgba(92,225,255,0.4);
  white-space: pre;
  text-align: left;
  display: inline-block;
  letter-spacing: 0.04em;
}
.logo-meta {
  display: flex;
  gap: 14px;
  font-family: var(--font-disp);
  font-size: 9px;
  color: var(--dim);
  letter-spacing: 0.1em;
}
.logo-meta em {
  font-style: normal;
  color: var(--c-yellow);
}

/* ── AI GRID ── */
.ai-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 6px;
}
.ai-item {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 10px 8px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.15s, background 0.15s;
}
.ai-item::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border2), transparent);
  opacity: 0;
  transition: opacity 0.15s;
}
.ai-item:hover { border-color: var(--border3); background: var(--surf2); }
.ai-item:hover::before { opacity: 1; }

.ai-item pre {
  font-family: var(--font-mono);
  font-size: clamp(5.5px, 0.65vw, 7px);
  line-height: 1.15;
  white-space: pre;
  text-align: left;
  display: inline-block;
  color: var(--text);
  opacity: 0.9;
}
.ai-item .lbl {
  font-size: 8px;
  letter-spacing: 0.15em;
  color: var(--dim);
  text-transform: uppercase;
}

/* logo color classes */
.lg-openai    { color: #4dff91; text-shadow: 0 0 12px rgba(77,255,145,0.3); }
.lg-anthropic { color: #ff8c42; text-shadow: 0 0 12px rgba(255,140,66,0.3); }
.lg-deepseek  { color: #5ce1ff; text-shadow: 0 0 12px rgba(92,225,255,0.3); }
.lg-google    { color: #5ce1ff; text-shadow: 0 0 12px rgba(92,225,255,0.3); }
.lg-meta      { color: #b87fff; text-shadow: 0 0 12px rgba(184,127,255,0.3); }
.lg-mistral   { color: #ffd84d; text-shadow: 0 0 12px rgba(255,216,77,0.3); }
.lg-xai       { color: #bebed4; text-shadow: 0 0 12px rgba(190,190,212,0.2); }
.lg-minimax   { color: #5ce1ff; text-shadow: 0 0 12px rgba(92,225,255,0.3); }
.lg-moonshot  { color: #b87fff; text-shadow: 0 0 12px rgba(184,127,255,0.3); }
.lg-llmia     { color: #5ce1ff; text-shadow: 0 0 12px rgba(92,225,255,0.3); }

/* ── RADAR ── */
.radar-wrap { display: flex; flex-direction: column; gap: 5px; }
.radar-row {
  display: grid;
  grid-template-columns: 110px 1fr;
  align-items: center;
  gap: 10px;
  padding: 4px 6px;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.radar-row:last-child { border-bottom: none; }
.radar-row:hover { background: rgba(255,255,255,0.02); }
.rname {
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rbars { display: flex; gap: 3px; align-items: flex-end; height: 30px; }
.rbar {
  flex: 1;
  height: 30px;
  background: var(--bg);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.rbar-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 0;
  transition: none;
}
.rbar-fill::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: rgba(255,255,255,0.25);
}
.rbar-label {
  position: absolute;
  top: 3px; left: 0; right: 0;
  font-size: 7px;
  text-align: center;
  color: rgba(6,6,10,0.8);
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  z-index: 1;
}

/* axis labels row */
.axis-row {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 10px;
  padding: 3px 6px 0;
}
.axis-lbls {
  display: flex;
  gap: 3px;
  font-size: 7px;
  color: var(--dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.axis-lbls span { flex: 1; text-align: center; }

/* ── MATCH ── */
.match-arena {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 14px;
  align-items: center;
  padding: 8px 0;
}
.match-m {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.match-ml {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.match-name {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.match-co {
  font-size: 8px;
  color: var(--dim);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.match-status {
  font-size: 8px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--dim);
  min-height: 12px;
}
.match-bar-wrap {
  height: 5px;
  background: var(--bg);
  border: 1px solid var(--border);
  overflow: hidden;
}
.match-bar {
  height: 100%;
  width: 0%;
}
.match-vs {
  font-family: var(--font-disp);
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.15em;
  padding: 0 4px;
}
.match-footer {
  margin-top: 14px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 8px;
  color: var(--dim);
  letter-spacing: 0.12em;
}
.blink-live {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--c-red);
}
.blink-live::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--c-red);
  box-shadow: 0 0 6px var(--c-red);
  animation: livepulse 1.2s ease-in-out infinite;
}
@keyframes livepulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.8)} }

/* ── LEADERBOARD ── */
.lb-table { display: flex; flex-direction: column; gap: 1px; }
.lb-row {
  display: grid;
  grid-template-columns: 32px 1fr auto 52px;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  background: var(--bg);
  border: 1px solid transparent;
  transition: border-color 0.1s;
  font-size: 10px;
}
.lb-row:hover { border-color: var(--border3); background: var(--surf2); }
.lb-rank {
  font-size: 9px;
  color: var(--dim);
  font-weight: 700;
}
.lb-rank.gold   { color: #ffd84d; }
.lb-rank.silver { color: #aaaacc; }
.lb-rank.bronze { color: #ff8c42; }
.lb-name { color: var(--text); }
.lb-name .co { color: var(--dim); margin-left: 5px; font-size: 8px; }
.lb-bars { display: flex; gap: 2px; height: 12px; }
.lb-bar-track {
  flex: 1;
  background: var(--surf2);
  border: 1px solid var(--border);
  overflow: hidden;
  position: relative;
}
.lb-bar-fill {
  position: absolute;
  inset: 0;
  width: 0%;
}
.lb-score { font-size: 8px; letter-spacing: 0.08em; color: var(--c-yellow); text-align: right; }

/* ── BENCH ── */
.bench-list { display: flex; flex-direction: column; gap: 7px; }
.bench-row {
  display: grid;
  grid-template-columns: 90px 1fr 36px;
  align-items: center;
  gap: 8px;
  font-size: 10px;
}
.bench-lbl { font-size: 8px; letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; }
.bench-track {
  height: 7px;
  background: var(--bg);
  border: 1px solid var(--border);
  overflow: hidden;
}
.bench-fill { height: 100%; width: 0%; }
.bench-pct { font-size: 9px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }

/* ── CLI ── */
.cli-win {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 12px 14px;
  font-size: 10.5px;
  line-height: 1.75;
  min-height: 130px;
  position: relative;
  overflow: hidden;
}
.cli-win::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, var(--border2), transparent);
}
.cli-line {
  display: block;
  opacity: 0;
  transform: translateX(-3px);
}
.cl-cmd  { color: var(--c-cyan); }
.cl-out  { color: var(--c-green); }
.cl-err  { color: var(--c-red); }
.cl-warn { color: var(--c-yellow); }
.cl-dim  { color: var(--dim); }
.cl-norm { color: var(--text); }
.cl-cur {
  display: inline-block;
  width: 7px; height: 12px;
  background: var(--c-green);
  vertical-align: text-bottom;
  animation: cur 0.9s step-end infinite;
}
@keyframes cur { 0%,100%{opacity:1} 50%{opacity:0} }
.cli-ctrl { margin-top: 10px; display: flex; gap: 8px; }
.cli-btn {
  background: var(--surf2);
  border: 1px solid var(--border3);
  color: var(--dim);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 5px 12px;
  cursor: pointer;
  transition: all 0.12s;
}
.cli-btn:hover { border-color: var(--c-cyan); color: var(--c-cyan); }
.cli-btn.play  { border-color: rgba(77,255,145,0.4); color: var(--c-green); }
.cli-btn.play:hover { background: rgba(77,255,145,0.06); }

/* ── MATRIX ── */
.mtx-win {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 10px 14px;
  overflow: hidden;
}
#mtx-canvas {
  font-family: var(--font-mono);
  font-size: 9px;
  line-height: 1.2;
  color: rgba(77,255,145,0.55);
  text-shadow: 0 0 8px rgba(77,255,145,0.25);
  white-space: pre;
  overflow: hidden;
  user-select: none;
}

/* ── FOOTER ── */
.footer {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px 40px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 9px;
  color: var(--dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.footer a { color: var(--dim); text-decoration: none; transition: color 0.12s; }
.footer a:hover { color: var(--c-cyan); }
</style>
</head>
<body>

<div class="header">
  <div class="h-inner">
    <pre class="h-pre" id="logo-art"></pre>
    <div class="h-sub">ASCII Art Showcase // AI Model Evaluation Infrastructure</div>
    <div class="h-badges">
      <span class="badge dev">llmia.dev</span>
      <span class="badge live">llmia.live</span>
      <span class="badge pend">Season 0 Pending</span>
    </div>
  </div>
</div>

<div class="nav-bar" id="nav"></div>

<div class="grid" id="grid"></div>

<div class="footer">
  <a href="https://llmia.dev">llmia.dev</a>
  <span>Evidence Room &nbsp;·&nbsp; Live Broadcast &nbsp;·&nbsp; League</span>
  <a href="https://llmia.live">llmia.live</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>

function radarAnim() {
  RADAR_MODELS.forEach((m, mi) => {
    m.scores.forEach((s, si) => {
      const f = document.getElementById(`rbf-${mi}-${si}`);
      if (!f) return;
      f.style.height = (s/100*30) + 'px'; // fixed height inline, then width animates
      anime({
        targets: f,
        width: ['0%', '100%'],
        duration: 1100,
        delay: mi * 90 + si * 35,
        easing: 'easeOutCubic',
      });
    });
  });
}

function lbAnim() {
  LB.forEach((m, mi) => {
    m.bars.forEach((w, bi) => {
      const f = document.getElementById(`lbf-${m.rank}-${bi}`);
      if (!f) return;
      anime({
        targets: f,
        width: [0, w + '%'],
        duration: 1000,
        delay: mi * 60 + bi * 25,
        easing: 'easeOutCubic',
      });
    });
  });
}

function benchAnim() {
  BENCH.forEach((m, i) => {
    const fill = document.getElementById(`bf-${m.id}`);
    const pct  = document.getElementById(`bp-${m.id}`);
    if (!fill || !pct) return;
    setTimeout(() => {
      anime({
        targets: fill,
        width: m.v + '%',
        duration: 1300,
        easing: 'easeOutCubic',
        begin: () => { fill.style.width = '0%'; },
        update: (anim) => { pct.textContent = Math.round(anim.progress * m.v / 100) + '%'; },
        complete: () => { pct.textContent = m.v + '%'; },
      });
    }, i * 180);
  });
}

// ─── CLI TYPING ───────────────────────────────────────────────────────────────
(function() {
  let idx = 0, running = false, t = null;

  function show(i) {
    const el = document.getElementById('cl-' + i);
    if (!el) return;
    anime({ targets: el, opacity: [0,1], translateX: [-3,0], duration: 100, easing: 'easeOutCubic' });
    const cur = document.getElementById('cl-cur');
    if (cur) {
      cur.style.marginLeft = (el.offsetWidth + 2) + 'px';
      cur.style.display = 'inline-block';
    }
  }

  function run() {
    if (idx >= CLI.length) {
      const cur = document.getElementById('cl-cur');
      if (cur) cur.style.display = 'none';
      return;
    }
    show(idx); idx++;
    t = setTimeout(run, 320);
  }

  document.getElementById('cl-play').addEventListener('click', () => {
    if (running) return;
    running = true;
    idx = 0;
    document.querySelectorAll('.cli-line').forEach(e => { e.style.opacity = '0'; e.style.transform = 'translateX(-3px)'; });
    const cur = document.getElementById('cl-cur');
    if (cur) { cur.style.display = 'inline-block'; cur.style.animation = 'cur 0.9s step-end infinite'; }
    run();
  });

  document.getElementById('cl-reset').addEventListener('click', () => {
    clearTimeout(t); running = false; idx = 0;
    document.querySelectorAll('.cli-line').forEach(e => { e.style.opacity = '0'; e.style.transform = 'translateX(-3px)'; });
    const cur = document.getElementById('cl-cur');
    if (cur) cur.style.display = 'none';
  });
})();

// ─── MATRIX RAIN ─────────────────────────────────────────────────────────────
(function() {
  const cvs = document.getElementById('mtx-canvas');
  if (!cvs) return;
  const CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#%&*+/=?_|';
  const COLS = 66;
  let rows = Array.from({length: 16}, () =>
    Array.from({length: COLS}, () => Math.random() < 0.2 ? CH[Math.floor(Math.random()*CH.length)] : ' ').join('')
  );
  function draw() {
    rows.shift();
    rows.push(Array.from({length: COLS}, () => Math.random() < 0.2 ? CH[Math.floor(Math.random()*CH.length)] : ' ').join(''));
    cvs.textContent = rows.join('\n');
  }
  draw();
  setInterval(draw, 160);
})();
