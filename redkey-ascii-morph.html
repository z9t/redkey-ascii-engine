<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RedKey Multi-Script ASCII — Engine</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:monospace}
  #c{display:block;width:100vw;height:100vh}
  #hint{position:fixed;bottom:12px;left:12px;color:#b8aa98;font-size:12px;opacity:.4}
  #tuner{position:fixed;top:14px;right:14px;width:362px;max-height:94vh;overflow:auto;z-index:10;background:rgba(10,10,12,.85);border:1px solid #2a2a2e;border-radius:10px;padding:10px 12px;color:#e8e0d6;font:11px/1.3 monospace;backdrop-filter:blur(6px)}
  #tuner h1{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#dc2626;margin:0 0 6px;cursor:move;user-select:none}
  .src{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px}
  .src select,.src button{background:#2a2a2e;border:1px solid #2a2a2e;color:#e8e0d6;font:10px monospace;border-radius:5px;padding:4px 6px;cursor:pointer}
  .src button.on{background:#dc2626;color:#fff}
  #prevA,#prevB{width:48%;height:54px;image-rendering:pixelated;border:1px solid #2a2a2e;border-radius:5px;background:#111;vertical-align:top}
  .head,.row{display:grid;grid-template-columns:66px 32px 1fr 32px 46px;gap:4px;align-items:center}
  .head{color:#6b6b6b;font-size:9px;margin-bottom:3px}.row{margin:3px 0}
  .row label{color:#b8aa98;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row input[type=number]{width:30px;background:#1a1a1e;border:1px solid #2a2a2e;color:#fafafa;font:10px monospace;border-radius:3px;padding:1px 1px}
  .row input[type=range]{width:100%;accent-color:#dc2626}
  .mot{display:flex;gap:3px;justify-content:flex-end}
  .mot input{appearance:none;-webkit-appearance:none;margin:0;cursor:pointer;width:13px;height:13px;border-radius:3px;border:1.5px solid #555;background:transparent}
  .mot .ms{border-color:#dc2626}.mot .ms:checked{background:#dc2626}
  .mot .mr{border-color:#b8aa98}.mot .mr:checked{background:#b8aa98}
  .mot .mt{border-color:#fafafa}.mot .mt:checked{background:#fafafa}
  details summary{cursor:pointer;color:#b8aa98;font-size:11px;margin:6px 0}
  #randscripts{background:none;border:none;cursor:pointer;font-size:12px;float:right}
  .chip{display:inline-block;margin:2px;padding:2px 5px;border-radius:4px;font-size:9px;cursor:pointer;background:#2a2a2e;color:#fff}
  #bankgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
  .thumb{position:relative;aspect-ratio:16/10;background:#1a1a1e center/cover no-repeat;border:1px solid #2a2a2e;border-radius:4px;cursor:pointer}
  .thumb.cur{border-color:#dc2626}.thumb .x{position:absolute;top:-1px;right:2px;color:#dc2626;font-size:12px;cursor:pointer;text-shadow:0 0 3px #000}
  .colors{display:flex;gap:6px;align-items:center;margin:8px 0 4px}.colors input[type=color]{width:28px;height:20px;border:none;background:none;cursor:pointer}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .btns button{flex:1;min-width:60px;background:#dc2626;border:none;color:#fff;padding:6px;border-radius:6px;cursor:pointer;font:11px monospace}
  .btns button.ghost{background:#2a2a2e;color:#b8aa98}
  #show{position:fixed;top:14px;right:14px;background:#dc2626;border:none;color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;font:11px monospace;display:none;z-index:10}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hint">drop an image or video file anywhere</div>
<button id="show">tuner</button>
<form id="tuner" onsubmit="return false">
  <h1>RedKey ASCII · engine</h1>
  <div style="display:flex;gap:4%;margin-bottom:8px"><canvas id="prevA" width="160" height="54" title="layer A"></canvas><canvas id="prevB" width="160" height="54" title="layer B"></canvas></div>
  <div class="src"><span style="color:#b8aa98">layer</span><button type="button" id="la" class="on">A</button><button type="button" id="lb">B</button>
    <select id="ntype" title="noise type"><option value="fbm">fbm</option><option value="warp">warp</option><option value="ridged">ridged</option><option value="cellular">cellular</option><option value="waves">waves</option><option value="static">static</option></select>
    <select id="fitmode" title="media scale"><option value="fit">fit</option><option value="fill">fill</option><option value="stretch">stretch</option><option value="manual">manual</option></select>
    <button type="button" id="bnoise" class="on">noise</button><button type="button" id="bvideo">🎬</button><button type="button" id="bimage">🖼</button><button type="button" id="btext">text</button><button type="button" id="bscreen">screen</button><button type="button" id="beject">⏏</button>
    <input type="file" id="fvid" accept="video/*" hidden><input type="file" id="fimg" accept="image/*" hidden></div>
  <div class="src"><input id="textval" type="text" value="REDKEY" style="flex:1;min-width:88px;background:#1a1a1e;border:1px solid #2a2a2e;color:#fafafa;font:10px monospace;border-radius:5px;padding:4px" title="text source">
    <input id="fontname" type="text" value="monospace" style="width:96px;background:#1a1a1e;border:1px solid #2a2a2e;color:#fafafa;font:10px monospace;border-radius:5px;padding:4px" title="font family">
    <button type="button" id="fontpick">fonts</button><label><input type="checkbox" id="textbold" checked> bold</label><span id="livestat" style="color:#6b6b6b;font-size:9px"></span></div>
  <div class="src"><label><input type="checkbox" id="bon"> blend B</label>
    <select id="blend"><option value="mix">mix</option><option value="multiply">multiply</option><option value="screen">screen</option><option value="add">add</option><option value="max">max</option><option value="min">min</option><option value="difference">difference</option></select>
    <span style="color:#6b6b6b;font-size:9px">(mix slider below ↓ is motion-able)</span></div>
  <details class="bank" open><summary>media bank</summary><div id="bankgrid"></div></details>
  <div class="head"><span></span><span>min</span><span>slider</span><span>max</span><span class="mot" title="sine·random·smooth">∿◇~</span></div>
  <div id="rows"></div>
  <div style="color:#6b6b6b;font-size:9px;margin-top:5px">∿ sine · ◇ random · ~ smooth — each between that row's min↔max</div>
  <div class="colors"><input type="color" id="col0" value="#dc2626"><input type="color" id="col1" value="#b8aa98"><input type="color" id="col2" value="#fafafa"><label><input type="checkbox" id="emoji"> emojis</label></div>
  <details class="scripts"><summary>scripts → colour <button type="button" id="randscripts">🎲</button></summary><div id="chips"></div></details>
  <div class="btns"><button type="button" id="rand">🎲 randomise</button><button type="button" id="rec" class="ghost">● record</button><button type="button" id="copy" class="ghost">copy preset</button><button type="button" id="paste" class="ghost">load</button><button type="button" id="reset" class="ghost">reset</button><button type="button" id="hide" class="ghost">hide</button></div>
</form>
<script>
const CTRL={
  cell:{v:22,min:10,max:44,step:1,l:"glyph size"},fps:{v:24,min:6,max:60,step:1,l:"speed (fps)"},
  ease:{v:.12,min:.01,max:.6,step:.01,l:"tween/trail"},reroll:{v:.02,min:0,max:.25,step:.005,l:"glyph churn"},
  mix:{v:.5,min:0,max:1,step:.02,l:"blend mix"},
  noiseScale:{v:.6,min:.05,max:6,step:.05,l:"noise scale"},noiseAmt:{v:1,min:0,max:3,step:.05,l:"noise contrast"},
  flow:{v:.5,min:0,max:4,step:.05,l:"noise flow"},drift:{v:.012,min:0,max:.06,step:.002,l:"colour drift"},
  turb:{v:0,min:0,max:1.5,step:.02,l:"turbulence"},breathe:{v:0,min:0,max:1,step:.02,l:"breathing"},
  tilt:{v:0,min:0,max:45,step:1,l:"glyph tilt"},edge:{v:0,min:0,max:1.5,step:.05,l:"edge density"},
  thresh:{v:.16,min:0,max:.6,step:.01,l:"density floor"},bright:{v:1,min:.3,max:1.8,step:.05,l:"brightness"},
  tint:{v:0,min:-1,max:1,step:.05,l:"warm↔cool"},vignette:{v:0,min:0,max:1,step:.05,l:"vignette"},
  fbOpacity:{v:0,min:0,max:.97,step:.02,l:"feedback"},
  trX:{v:0,min:-320,max:320,step:1,l:"pos X"},trY:{v:0,min:-220,max:220,step:1,l:"pos Y"},trScaleX:{v:1,min:.2,max:3,step:.01,l:"scale X"},trScaleY:{v:1,min:.2,max:3,step:.01,l:"scale Y"},
  transDur:{v:6,min:1,max:30,step:.5,l:"duration s"},transChaos:{v:.6,min:0,max:1.5,step:.05,l:"mid chaos"},renderFps:{v:30,min:6,max:60,step:1,l:"render fps"},
  transColor:{v:1,min:0,max:1,step:1,l:"colour match"},transPulse:{v:.32,min:0,max:1,step:.02,l:"size pulse"},transSizeNoise:{v:0,min:0,max:1,step:1,l:"size↔noise"},
  particleMode:{v:0,min:0,max:1,step:1,l:"particle mode"},pGravity:{v:.08,min:-1,max:1,step:.01,l:"gravity"},pWind:{v:.02,min:-1,max:1,step:.01,l:"wind"},pTurb:{v:.25,min:0,max:2,step:.02,l:"particle turb"},pAttract:{v:.25,min:-2,max:2,step:.02,l:"attract/repel"},pDrag:{v:.94,min:.75,max:1,step:.005,l:"drag"},pLife:{v:140,min:20,max:420,step:5,l:"lifespan"},
  sineRate:{v:.3,min:.02,max:6,step:.02,l:"sine rate"},randRate:{v:1,min:.1,max:12,step:.1,l:"random rate"},modSmooth:{v:.08,min:.01,max:.5,step:.01,l:"mod smooth"},
};
const NOMOTION=new Set(["cell","fps","sineRate","randRate","modSmooth","transDur","transChaos","renderFps","transColor","transSizeNoise","particleMode","trX","trY","trScaleX","trScaleY"]);
for(const k in CTRL){CTRL[k].mSine=false;CTRL[k].mRand=false;CTRL[k].mSmooth=false;}
const g=k=>CTRL[k].v;
let EMOJIS=false,blendMode="mix",bOn=false;
const TRANSFORMS={feedback:{x:0,y:0,sx:1,sy:1},text:{x:0,y:0,sx:1,sy:1},A:{x:0,y:0,sx:1,sy:1},B:{x:0,y:0,sx:1,sy:1}};
let transformTarget="feedback";
const trFor=L=>L===LA?TRANSFORMS.A:L===LB?TRANSFORMS.B:TRANSFORMS.text;

const SCRIPTS={arabic:["بسم","الله","نور","حياة","قلم","علم","سلام"],japanese:["夢","風","月","花","空","星","海","心","光","桜","雪","炎"],korean:["달","별","꽃","바다","하늘","숲","빛","길","봄"],chinese:["龍","鳳","山","水","天","地","道","禪","雲","霧","虎","鶴","竹","梅"],hindi:["प्रेम","शांति","ज्ञान","शक्ति","आकाश","अग्नि","जल"],tamil:["காதல்","அமைதி","ஞானம்","வானம்"],cyrillic:["мир","свет","душа","сила","небо","огонь","ветер"],greek:["ψυχή","λόγος","σοφία","χάος","κόσμος"],thai:["ฝัน","ฟ้า","จันทร์","ดาว","น้ำ","ไฟ","ลม","ดิน"],hebrew:["שלום","אמת","חכמה","אור","חיים","אהבה"],georgian:["მზე","მთვარე","ზღვა","ცეცხლი","ქარი"],armenian:["սեր","լույս","կյանք","արև","լուսին"],tibetan:["རྨི་ལམ།","སྐར་མ།","ཟླ་བ།","ཉི་མ།","མེ།","ཆུ།"],amharic:["ፍቅር","ሰላም","ብርሃን","ሕይወት"],khmer:["ផ្កាយ","ភ្លើង","ទឹក"],lao:["ດາວ","ໄຟ","ລົມ"],mongolian:["нар","сар","од","гал"],uyghur:["ئارزۇ","ئاي","ئوت"],devanagari:["ॐ","अ","क","म","श"]};
const EMOJI_POOL=["✨","⭐","🌟","💫","🔥","💧","🌙","⚡","💎","🫧","🌀","🧿","🪷"];
function flat(...k){return k.flatMap(s=>(SCRIPTS[s]||[]).flatMap(w=>Array.from(w)));}
const BANDS=[{color:"#dc2626",pool:[]},{color:"#b8aa98",pool:[]},{color:"#fafafa",pool:[]}];
const ALLSCRIPTS=Object.keys(SCRIPTS);
const DEFGROUPS=[["chinese","japanese","korean"],["arabic","hebrew","thai","tibetan","hindi","tamil","khmer","lao","uyghur","devanagari"],["greek","cyrillic","armenian","georgian","amharic","mongolian"]];
const SCRIPT_BAND={};DEFGROUPS.forEach((grp,i)=>grp.forEach(s=>SCRIPT_BAND[s]=i));ALLSCRIPTS.forEach(s=>{if(SCRIPT_BAND[s]==null)SCRIPT_BAND[s]=0;});
function rebuildPools(){BANDS.forEach((b,i)=>{b.pool=flat(...ALLSCRIPTS.filter(s=>SCRIPT_BAND[s]===i));if(!b.pool.length)b.pool=["·"];});}rebuildPools();
function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function tintRgb(rgb,amt){const warm=[255,90,20],cool=[60,150,255],to=amt<0?warm:cool,a=Math.abs(amt)*0.55;return`rgb(${rgb.map((v,i)=>Math.round(v+(to[i]-v)*a)).join(",")})`;}
function hash(x,y){let n=(x|0)*374761393+(y|0)*668265263;n=(n^(n>>13))*1274126177;return((n^(n>>16))>>>0)/4294967295;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){let s=0,a=0.5,f=1;for(let i=0;i<3;i++){s+=a*vnoise(x*f,y*f);f*=2.1;a*=0.5;}return s/0.875;}
function cellular(x,y){const xi=Math.floor(x),yi=Math.floor(y);let md=9;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){const gx=xi+ox,gy=yi+oy,fx=gx+hash(gx,gy),fy=gy+hash(gy*3,gx*3);const d=(x-fx)*(x-fx)+(y-fy)*(y-fy);if(d<md)md=d;}return Math.min(1,Math.sqrt(md));}
function noiseVal(x,y,z,nt){switch(nt){case"fbm":return fbm(x,y+z);case"warp":{const wx=fbm(x+z,y)*2,wy=fbm(x,y-z)*2;return fbm(x+wx,y+wy);}case"ridged":return 1-Math.abs(2*fbm(x,y+z)-1);case"cellular":return cellular(x,y+z*0.3);case"waves":return(Math.sin(x*3+z*3)*Math.cos(y*3)+1)/2;case"static":return hash(x*97+((z*60)|0),y*131);default:return fbm(x,y+z);}}

const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const fb=document.createElement("canvas"),fbc=fb.getContext("2d");
const off=document.createElement("canvas"),octx=off.getContext("2d",{willReadFrequently:true});
const prevA=document.getElementById("prevA"),pAc=prevA.getContext("2d"),prevB=document.getElementById("prevB"),pBc=prevB.getContext("2d");
let cols,rows,tgt,dsp,glyphs,jit,t=0;
function rand(a){return a[(Math.random()*a.length)|0];}
function pick(b){return(EMOJIS&&Math.random()<0.12)?rand(EMOJI_POOL):rand(BANDS[b].pool);}
function band(x,y){const d=g("drift"),n=Math.sin(x*0.16+t*d)*Math.cos(y*0.2-t*d*0.7)+Math.sin((x+y)*0.08+t*d*0.5);return n<-0.4?0:n<0.5?1:2;}

// ---- two source layers ----
function mkLayer(){return{mode:"noise",ntype:"fbm",fit:"fit",video:null,stream:null,url:"",img:null,text:"REDKEY",font:"monospace",bold:true,buf:new Float32Array(0)};}
const LA=mkLayer(),LB=mkLayer();LB.mode="off";let active=LA;
function fillNoise(buf,nt){const sc=g("noiseScale")*0.1,z=t*0.01*g("flow"),amt=g("noiseAmt");for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let n=noiseVal(x*sc,y*sc,z,nt);n=(n-0.5)*amt+0.5;buf[y*cols+x]=n<0?0:n>1?1:n;}}
function fillMedia(buf,src,L){const sw=src.videoWidth||src.naturalWidth||src.width,sh=src.videoHeight||src.naturalHeight||src.height;if(!sw||!sh)return;const ar=sw/sh,fit=L.fit||"fit";octx.setTransform(1,0,0,1,0,0);octx.fillStyle="#000";octx.fillRect(0,0,cols,rows);let x=0,y=0,w=cols,h=rows;
  if(fit==="fit"){h=cols/ar;if(h>rows){h=rows;w=rows*ar;}else w=cols;x=(cols-w)/2;y=(rows-h)/2;}
  else if(fit==="fill"){h=cols/ar;if(h<rows){h=rows;w=rows*ar;}else w=cols;x=(cols-w)/2;y=(rows-h)/2;}
  else if(fit==="manual"){const tr=trFor(L);h=cols/ar;w=cols;const sx=Math.max(.02,tr.sx),sy=Math.max(.02,tr.sy);w*=sx;h*=sy;x=(cols-w)/2+tr.x/g("cell");y=(rows-h)/2+tr.y/g("cell");}
  octx.drawImage(src,x,y,w,h);const d=octx.getImageData(0,0,cols,rows).data;for(let i=0;i<cols*rows;i++)buf[i]=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])/255;}
function fillText(buf,L){octx.setTransform(1,0,0,1,0,0);octx.fillStyle="#000";octx.fillRect(0,0,cols,rows);const tr=TRANSFORMS.text,txt=L.text||" ";octx.save();octx.translate(cols/2+tr.x/g("cell"),rows/2+tr.y/g("cell"));octx.scale(Math.max(.05,tr.sx),Math.max(.05,tr.sy));octx.fillStyle="#fff";octx.textAlign="center";octx.textBaseline="middle";octx.font=`${L.bold?700:400} ${Math.max(8,rows*.34)}px ${L.font||"monospace"}`;octx.fillText(txt,0,0,cols*1.8);octx.restore();const d=octx.getImageData(0,0,cols,rows).data;for(let i=0;i<cols*rows;i++)buf[i]=d[i*4]/255;}
function sampleLayer(L){if(L.buf.length!==cols*rows)L.buf=new Float32Array(cols*rows);
  if(L.mode==="noise")fillNoise(L.buf,L.ntype);
  else if(L.mode==="video"||L.mode==="screen"){if(L.video&&L.video.readyState>=2)fillMedia(L.buf,L.video,L);}
  else if(L.mode==="image"){if(L.img)fillMedia(L.buf,L.img,L);}
  else if(L.mode==="text")fillText(L.buf,L);}
function combine(){if(!bOn||LB.mode==="off"){tgt.set(LA.buf);return;}const mix=g("mix");
  for(let i=0;i<tgt.length;i++){const a=LA.buf[i],b=LB.buf[i];let r;switch(blendMode){case"mix":r=a*(1-mix)+b*mix;break;case"multiply":r=a*b;break;case"screen":r=1-(1-a)*(1-b);break;case"add":r=Math.min(1,a+b);break;case"max":r=Math.max(a,b);break;case"min":r=Math.min(a,b);break;case"difference":r=Math.abs(a-b);break;default:r=a;}tgt[i]=r;}}
function stopVideo(L){if(L.video){try{L.video.pause();L.video.removeAttribute("src");L.video.srcObject=null;L.video.load();}catch(e){}L.video=null;}if(L.stream){try{L.stream.getTracks().forEach(tr=>tr.stop());}catch(e){}L.stream=null;}L.url="";}
function layerNoise(L){stopVideo(L);L.mode="noise";refreshSrc();}
function playInto(L,url){stopVideo(L);L.url=url;L.video=document.createElement("video");L.video.src=url;L.video.loop=true;L.video.muted=true;L.video.playsInline=true;L.video.addEventListener("loadeddata",()=>{L.mode="video";refreshSrc();L.video.play();},{once:true});L.video.addEventListener("error",()=>layerNoise(L),{once:true});}
function imgInto(L,file){stopVideo(L);const url=URL.createObjectURL(file);L.img=new Image();L.img.onload=()=>{L.mode="image";refreshSrc();fillMedia(L.buf,L.img,L);URL.revokeObjectURL(url);};L.img.src=url;}
function textInto(L){stopVideo(L);L.mode="text";refreshSrc();}
async function screenInto(L){if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){document.getElementById("livestat").textContent="screen unsupported";return;}try{const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});stopVideo(L);L.stream=stream;L.video=document.createElement("video");L.video.srcObject=stream;L.video.muted=true;L.video.playsInline=true;L.video.onloadedmetadata=()=>{L.mode="screen";L.video.play();refreshSrc();document.getElementById("livestat").textContent="screen live";};stream.getVideoTracks()[0].addEventListener("ended",()=>{if(L.mode==="screen")layerNoise(L);});}catch(e){document.getElementById("livestat").textContent="screen cancelled";}}
function refreshSrc(){document.getElementById("la").classList.toggle("on",active===LA);document.getElementById("lb").classList.toggle("on",active===LB);document.getElementById("ntype").value=active.ntype;document.getElementById("fitmode").value=active.fit||"fit";document.getElementById("textval").value=active.text||"";document.getElementById("fontname").value=active.font||"monospace";document.getElementById("textbold").checked=!!active.bold;["bnoise","bvideo","bimage","btext","bscreen"].forEach(b=>document.getElementById(b).classList.remove("on"));const id={noise:"bnoise",video:"bvideo",image:"bimage",text:"btext",screen:"bscreen"}[active.mode];if(id)document.getElementById(id).classList.add("on");renderBank();}

// ---- media bank ----
const bank=[],MAXBANK=10,bankgrid=document.getElementById("bankgrid");

async function renderTransition(sequence=false){if(rendering)return;rendering=true;const stat=document.getElementById("tstat"),fps=g("renderFps"),frames=Math.max(1,Math.round(g("transDur")*fps)),prev={bOn,blend:blendMode,mix:g("mix"),turb:g("turb"),reroll:g("reroll"),ms:CTRL.mix.mSine,mr:CTRL.mix.mRand,mt:CTRL.mix.mSmooth,t,lbMode:LB.mode};try{stat.textContent=`stepping ${frames} frames`;CTRL.mix.mSine=CTRL.mix.mRand=CTRL.mix.mSmooth=false;bOn=true;document.getElementById("bon").checked=true;if(LB.mode==="off")LB.mode="noise";blendMode="mix";document.getElementById("blend").value="mix";refreshSrc();sampleLayer(LA);sampleLayer(LB);const palA=samplePaletteFromLayer(LA),palB=samplePaletteFromLayer(LB),chaos=g("transChaos");const draw=async(i,n)=>{const p=n<=1?1:i/(n-1),ep=easeP(p),c=chaos*Math.sin(Math.PI*p);t=prev.t+i;applyMod(i/fps);setCTRLVal("mix",ep);setCTRLVal("turb",prev.turb+c*1.3);setCTRLVal("reroll",Math.min(.25,prev.reroll+c*.15));sampleLayer(LA);sampleLayer(LB);combine();const colors=g("transColor")>=.5?palA.map((a,j)=>lerpHex(a,palB[j],p)):null;frame({fontScale:1+g("transPulse")*Math.sin(Math.PI*p),sizeNoise:g("transSizeNoise"),colors});};if(sequence)await encodeZip(frames,draw,"redkey-transition-frames.zip",stat);else await encodeWebM(frames,fps,draw,"redkey-transition.webm",stat);stat.textContent=sequence?"saved transition PNG zip":"saved redkey-transition.webm";}catch(e){stat.textContent=e.message||"render failed";}finally{restoreTransition(prev);t=prev.t;rendering=false;}}
function seekVideo(v,time){return new Promise(res=>{const target=Math.min(Math.max(0,time),Math.max(0,(v.duration||time)-.001));if(Math.abs(v.currentTime-target)<.002){res();return;}const done=()=>{v.removeEventListener("seeked",done);res();};v.addEventListener("seeked",done,{once:true});try{v.currentTime=target;}catch(e){res();}});}
async function renderVideoFile(file,sequence=false){if(rendering)return;rendering=true;const stat=document.getElementById("tstat"),fps=g("renderFps"),url=URL.createObjectURL(file),v=document.createElement("video"),saved={mode:LA.mode,video:LA.video,url:LA.url,img:LA.img,stream:LA.stream,fit:LA.fit,t};try{v.src=url;v.muted=true;v.playsInline=true;await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=rej;});const frames=Math.max(1,Math.round((v.duration||1)*fps));LA.video=v;LA.url=url;LA.mode="video";LA.stream=null;refreshSrc();const draw=async(i,n)=>{t=saved.t+i;await seekVideo(v,i/fps);applyMod(i/fps);sampleLayer(LA);if(bOn&&LB.mode!=="off")sampleLayer(LB);combine();frame();};if(sequence)await encodeZip(frames,draw,"redkey-video-frames.zip",stat);else await encodeWebM(frames,fps,draw,"redkey-ascii-video.webm",stat);stat.textContent=sequence?"saved video PNG zip":"saved redkey-ascii-video.webm";}catch(e){stat.textContent=e.message||"video render failed";}finally{LA.mode=saved.mode;LA.video=saved.video;LA.url=saved.url;LA.img=saved.img;LA.stream=saved.stream;LA.fit=saved.fit;t=saved.t;URL.revokeObjectURL(url);refreshSrc();rendering=false;}}

function applyPreset(o){if(o._blend){blendMode=o._blend;document.getElementById("blend").value=o._blend;}if(o._bon!=null){bOn=o._bon;document.getElementById("bon").checked=bOn;}if(o._transforms)for(const k in o._transforms)if(TRANSFORMS[k])Object.assign(TRANSFORMS[k],o._transforms[k]);if(o._fitA)LA.fit=o._fitA;if(o._fitB)LB.fit=o._fitB;if(o._textA)Object.assign(LA,o._textA);if(o._textB)Object.assign(LB,o._textB);for(const k in o)if(CTRL[k]){Object.assign(CTRL[k],o[k]);const c=CTRL[k];if(!c._sl)continue;const r=c._sl.parentNode;r.querySelector(".mn").value=c.min;r.querySelector(".mx").value=c.max;c._sl.min=c.min;c._sl.max=c.max;c._sl.value=c.v;if(!NOMOTION.has(k)){r.querySelector(".ms").checked=!!c.mSine;r.querySelector(".mr").checked=!!c.mRand;r.querySelector(".mt").checked=!!c.mSmooth;}}loadTransformToCTRL();refreshSrc();build();}

function loadLayerImgUrl(L,url){return new Promise(res=>{const img=new Image();img.onload=()=>{stopVideo(L);L.img=img;L.mode="image";refreshSrc();res();};img.onerror=()=>res();img.src=url;});}
(async function(){const Q=new URLSearchParams(location.search);
  if(!["a","b","render","preset","dur","chaos"].some(k=>Q.has(k)))return;
  if(Q.has("dur"))CTRL.transDur.v=parseFloat(Q.get("dur"));
  if(Q.has("chaos"))CTRL.transChaos.v=parseFloat(Q.get("chaos"));
  if(Q.has("ease"))transEase=Q.get("ease");
  if(Q.has("preset")){try{const p=Q.get("preset");applyPreset(p.trim().startsWith("{")?JSON.parse(p):await(await fetch(p)).json());}catch(e){}}
  const L=[];
  if(Q.has("a"))L.push(loadLayerImgUrl(LA,Q.get("a")));
  if(Q.has("b")){L.push(loadLayerImgUrl(LB,Q.get("b")));bOn=true;document.getElementById("bon").checked=true;blendMode="mix";document.getElementById("blend").value="mix";}
  await Promise.all(L);refreshSrc();
  if(Q.get("render")==="1")setTimeout(renderTransition,800);})();
